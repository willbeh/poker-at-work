<app-topbar></app-topbar>

<main class="hero">
  <span class="hero-eyebrow">Planning Poker · Free · Real-time</span>

  <h1 class="hero-title">
    Estimate stories,<br><span>reach consensus.</span>
  </h1>

  @if (authUser$ | async; as user) {
  <button class="cta" (click)="createNewRoom(user.uid)">
    Create a room
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </button>
  } @else {
  <a class="cta-login" [routerLink]="['/login']">
    Sign in to get started
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </a>
  }
</main>
