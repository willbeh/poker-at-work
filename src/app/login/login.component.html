<div class="login-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-tile">P</div>
      <div>
        <div class="brand-title">Poker at Work</div>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="login-card">
      <span class="hero-eyebrow">Sign in to continue</span>

      <h1 class="card-title">Welcome back</h1>
      <p class="card-desc">Sign in to create rooms and run estimation sessions with your team.</p>

      <button class="google-btn" (click)="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.11c-.22-.66-.35-1.36-.35-2.11s.13-1.45.35-2.11V7.05H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.95l3.66-2.84z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84c.87-2.6 3.3-4.51 6.16-4.51z"
            fill="#EA4335" />
        </svg>
        Continue with Google
      </button>

      <a [routerLink]="['/']" class="back-link">← Back to home</a>
    </div>
  </main>
</div>
