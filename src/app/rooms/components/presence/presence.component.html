<div class="flex items-center justify-between mb-4">
  <h2 class="text-xl font-bold text-gray-800">Presence</h2>
  <button mat-icon-button
          (click)="onToggleSelfViewer()"
          [matTooltip]="isCurrentUserViewer ? 'Switch to voter' : 'Switch to viewer'">
    <mat-icon [ngClass]="isCurrentUserViewer ? 'text-blue-500' : 'text-gray-400'">
      {{ isCurrentUserViewer ? 'visibility' : 'visibility_off' }}
    </mat-icon>
  </button>
</div>
@if (people$ | async; as people) {
  <div class="flex flex-col gap-2">
    @for (presence of people; track presence) {
      <div
        class="bg-white shadow-sm rounded-lg border border-gray-200 p-3 flex items-center justify-between gap-3">
        <div class="font-medium text-gray-700 truncate flex-1 min-w-0" title="{{ presence.name }}">
          {{ presence.name }}
          @if (presence.isViewer) {
            <span class="text-xs text-blue-500 ml-1">(viewer)</span>
          }
        </div>
        <div class="shrink-0">
          <ng-container *ngTemplateOutlet="templateOutlet; context: { $implicit: presence }"></ng-container>
        </div>
      </div>
    }
  </div>
}
