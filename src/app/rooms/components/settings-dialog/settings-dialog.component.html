<div class="dlg-header">
  <div class="dlg-header-meta">
    <span class="settings-badge">SETTINGS</span>
    <span class="room-name">{{ data.name }}</span>
  </div>
  <button mat-icon-button class="close-btn" (click)="cancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="dlg-title">Tune the <span class="accent">table.</span></div>

<mat-dialog-content>
  <div class="section">
    <div class="section-head">
      <span class="section-label">ESTIMATION SCALE</span>
      <span class="count-badge">{{ options.length }}</span>
    </div>
    <div class="cards-row">
      @for (option of options; track option) {
        <span class="card-chip">
          {{ option }}
          <button class="chip-x" type="button" (click)="removeOption(option)">×</button>
        </span>
      }
      <input
        class="add-card-input"
        type="number"
        [(ngModel)]="newOption"
        (keyup.enter)="addOption()"
        placeholder="add card…"
      >
      <button class="add-card-btn" type="button" (click)="addOption()" [disabled]="newOption === null">+ ADD</button>
    </div>
  </div>

  <div class="section">
    <span class="section-label">ROUND BEHAVIOUR</span>
    <div class="setting-rows">
      <div class="setting-row">
        <div class="setting-text">
          <span class="setting-title">"?" card for uncertainty</span>
          <span class="setting-desc">VOTERS CAN PASS WHEN UNSURE</span>
        </div>
        <mat-slide-toggle [(ngModel)]="allowUnsure" color="primary"></mat-slide-toggle>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <span class="setting-title">Who can reveal</span>
          <span class="setting-desc">DECIDES WHEN CARDS FLIP</span>
        </div>
        <div class="segment-control">
          <button type="button" class="segment-btn" [class.active]="whoCanReveal === 'anyone'" (click)="whoCanReveal = 'anyone'">ANYONE</button>
          <button type="button" class="segment-btn" [class.active]="whoCanReveal === 'hostOnly'" (click)="whoCanReveal = 'hostOnly'">HOST ONLY</button>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <span class="footer-note"><span class="footer-dot">●</span> CHANGES APPLY TO THE NEXT ROUND</span>
  <div class="footer-btns">
    <button mat-button (click)="cancel()">Cancel</button>
    <button class="save-btn" (click)="save()">Save settings ↵</button>
  </div>
</mat-dialog-actions>
